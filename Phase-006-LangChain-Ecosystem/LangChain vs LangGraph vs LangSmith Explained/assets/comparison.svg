<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1914" viewBox="0 0 1600 1914" role="img" aria-label="LangChain vs LangGraph vs LangSmith — with FastAPI and Python"><title>LangChain vs LangGraph vs LangSmith — with FastAPI and Python</title><defs><linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4A62"/><stop offset="1" stop-color="#FF5A45"/></linearGradient><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#031273"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4A62"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><image href="../../../zz-Brand-Assets/Dragon-Motivation-Logo.png" x="60" y="44" width="72" height="106" preserveAspectRatio="xMidYMid meet"><title>Dragon Motivation logo</title></image><image href="../../../zz-Brand-Assets/SHASUVATHANAN-NAME.png" x="150" y="62" width="420" height="45" preserveAspectRatio="xMidYMid meet"><title>SHASU VATHANAN</title></image><image href="../../../zz-Brand-Assets/ShasuVathanan-GEN%20AI-Product-Manager.png" x="150" y="122" width="560" height="15" preserveAspectRatio="xMidYMid meet"><title>Shasu Vathanan - GEN AI - Product Manager</title></image><text x="1540" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#031273" text-anchor="end"><tspan x="1540" dy="0.0">Phase-006-LangChain-Ecosystem</tspan></text><text x="1540" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6391" text-anchor="end"><tspan x="1540" dy="0.0">AI Learning Assistant · GenAI Architect Journey</tspan></text><text x="1540" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="end" letter-spacing="1"><tspan x="1540" dy="0.0">SHASUVATHANAN.COM</tspan></text><rect x="60" y="176" width="1480" height="6" rx="3" fill="url(#coral)"/><text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#031273">LangChain <tspan fill="#FF4A62">vs</tspan> LangGraph <tspan fill="#FF4A62">vs</tspan> LangSmith</text><text x="60" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#5A6391" text-anchor="start"><tspan x="60" dy="0.0">Build · Orchestrate · Observe — and how FastAPI and Python bring them together</tspan></text><rect x="60" y="350" width="470" height="824.0" rx="20" fill="#F2F4FF"/><rect x="60" y="350" width="470" height="150" rx="20" fill="url(#coral)"/><rect x="60" y="470" width="470" height="30" rx="0" fill="url(#coral)"/><text x="92" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="3"><tspan x="92" dy="0.0">BUILD</tspan></text><text x="92" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="92" dy="0.0">LangChain</tspan></text><text x="92" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="92" dy="0.0">WHAT IT IS</tspan></text><text x="92" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="92" dy="0.0">An open-source framework for building</tspan><tspan x="92" dy="28.0">applications with language models.</tspan></text><text x="92" y="718.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="92" dy="0.0">KEY BUILDING BLOCKS</tspan></text><text x="92" y="752.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="92" dy="0.0">Chat models · prompt templates · output</tspan><tspan x="92" dy="28.0">parsers · tools · retrievers · LCEL</tspan><tspan x="92" dy="28.0">chains</tspan></text><text x="92" y="876.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="92" dy="0.0">USE IT WHEN</tspan></text><text x="92" y="910.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="92" dy="0.0">One or a few model calls with clear</tspan><tspan x="92" dy="28.0">inputs and outputs: Q&amp;A, summaries,</tspan><tspan x="92" dy="28.0">extraction.</tspan></text><text x="92" y="1034.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="92" dy="0.0">IN THIS PROJECT</tspan></text><text x="92" y="1068.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="92" dy="0.0">/ask — prompt template → chat model →</tspan><tspan x="92" dy="28.0">Pydantic output parser</tspan></text><rect x="565" y="350" width="470" height="824.0" rx="20" fill="#F2F4FF"/><rect x="565" y="350" width="470" height="150" rx="20" fill="#031273"/><rect x="565" y="470" width="470" height="30" rx="0" fill="#031273"/><text x="597" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="3"><tspan x="597" dy="0.0">ORCHESTRATE</tspan></text><text x="597" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="597" dy="0.0">LangGraph</tspan></text><text x="597" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="597" dy="0.0">WHAT IT IS</tspan></text><text x="597" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="597" dy="0.0">An open-source framework for stateful,</tspan><tspan x="597" dy="28.0">multi-step AI workflows built as</tspan><tspan x="597" dy="28.0">graphs.</tspan></text><text x="597" y="718.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="597" dy="0.0">KEY BUILDING BLOCKS</tspan></text><text x="597" y="752.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="597" dy="0.0">State · nodes · edges · conditional</tspan><tspan x="597" dy="28.0">routing · loops with limits ·</tspan><tspan x="597" dy="28.0">human-in-the-loop</tspan></text><text x="597" y="876.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="597" dy="0.0">USE IT WHEN</tspan></text><text x="597" y="910.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="597" dy="0.0">The order of steps matters: branching,</tspan><tspan x="597" dy="28.0">retries, approvals, long-running state.</tspan></text><text x="597" y="1034.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="597" dy="0.0">IN THIS PROJECT</tspan></text><text x="597" y="1068.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="597" dy="0.0">/workflow — classify → explain → add</tspan><tspan x="597" dy="28.0">example → validate → retry or fallback</tspan></text><rect x="1070" y="350" width="470" height="824.0" rx="20" fill="#FFFFFF" stroke="#FF4A62" stroke-width="2.5"/><rect x="1070" y="350" width="470" height="150" rx="20" fill="#FFF1F3"/><rect x="1071.25" y="470" width="467.5" height="30" rx="0" fill="#FFF1F3"/><text x="1102" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="3"><tspan x="1102" dy="0.0">OBSERVE</tspan></text><text x="1102" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#031273" text-anchor="start"><tspan x="1102" dy="0.0">LangSmith</tspan></text><text x="1102" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="1102" dy="0.0">WHAT IT IS</tspan></text><text x="1102" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="1102" dy="0.0">A hosted platform to trace, debug,</tspan><tspan x="1102" dy="28.0">monitor and evaluate LLM applications.</tspan></text><text x="1102" y="718.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="1102" dy="0.0">KEY BUILDING BLOCKS</tspan></text><text x="1102" y="752.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="1102" dy="0.0">Traces · run trees · latency and token</tspan><tspan x="1102" dy="28.0">metrics · datasets · evaluators ·</tspan><tspan x="1102" dy="28.0">experiments</tspan></text><text x="1102" y="876.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="1102" dy="0.0">USE IT WHEN</tspan></text><text x="1102" y="910.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="1102" dy="0.0">Worth adding to any LLM app: see why an</tspan><tspan x="1102" dy="28.0">answer happened, find slow steps, test</tspan><tspan x="1102" dy="28.0">changes.</tspan></text><text x="1102" y="1034.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="2"><tspan x="1102" dy="0.0">IN THIS PROJECT</tspan></text><text x="1102" y="1068.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="1102" dy="0.0">Optional tracing from .env; each</tspan><tspan x="1102" dy="28.0">workflow run returns a trace_id</tspan></text><rect x="60" y="1214.0" width="1480" height="110" rx="18" fill="#FFFFFF" stroke="#FF4A62" stroke-width="2.5"/><text x="96" y="1262.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FF4A62" text-anchor="start" letter-spacing="3"><tspan x="96" dy="0.0">SERVE</tspan></text><text x="96" y="1298.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#031273" text-anchor="start"><tspan x="96" dy="0.0">FastAPI</tspan></text><text x="330" y="1264.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="330" dy="0.0">Exposes the assistant over HTTP: Pydantic request validation, consistent error codes, request logging and</tspan><tspan x="330" dy="27.0">interactive Swagger UI at /docs.</tspan></text><rect x="60" y="1349.0" width="1480" height="110" rx="18" fill="#031273"/><text x="96" y="1397.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFB3BE" text-anchor="start" letter-spacing="3"><tspan x="96" dy="0.0">IMPLEMENT</tspan></text><text x="96" y="1433.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="96" dy="0.0">Python</tspan></text><text x="330" y="1399.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="330" dy="0.0">Runs everything: configuration, safe logging, the LangChain chains, the LangGraph workflow, the FastAPI app and</tspan><tspan x="330" dy="27.0">the pytest test suite.</tspan></text><text x="60" y="1524.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#031273" text-anchor="start"><tspan x="60" dy="0.0">How they relate</tspan></text><rect x="60" y="1554.0" width="8" height="52" rx="4" fill="url(#coral)"/><text x="90" y="1586.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="90" dy="0.0">Independent, not a required sequence: LangGraph can orchestrate any Python code, with or without LangChain inside its nodes.</tspan></text><rect x="60" y="1632.0" width="8" height="52" rx="4" fill="url(#coral)"/><text x="90" y="1664.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="90" dy="0.0">Complementary: LangChain components plug into LangGraph nodes when they are useful — as in this project.</tspan></text><rect x="60" y="1710.0" width="8" height="52" rx="4" fill="url(#coral)"/><text x="90" y="1742.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="90" dy="0.0">LangSmith only observes and evaluates. It is optional; the application runs the same without it.</tspan></text><line x1="60" y1="1794.0" x2="1540" y2="1794.0" stroke="#DDE1F2" stroke-width="1.5"/><image href="../../../zz-Brand-Assets/NeGot-My-AI-Avatar.png" x="60" y="1810.0" width="64" height="64" preserveAspectRatio="xMidYMid meet"><title>NeGot - my AI avatar</title></image><text x="138" y="1838.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#031273" text-anchor="start"><tspan x="138" dy="0.0">Shasu Vathanan - GEN AI - Product Manager</tspan></text><text x="138" y="1862.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF4A62" text-anchor="start" letter-spacing="0.5"><tspan x="138" dy="0.0">SHASUVATHANAN.COM  ·  linkedin.com/in/shasuvathanan</tspan></text><text x="1540" y="1830.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6391" text-anchor="end"><tspan x="1540" dy="0.0">Independently designed and maintained by Shasu Vathanan.</tspan></text></svg>
