<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="AI Learning Assistant — system architecture"><title>AI Learning Assistant — system architecture</title><defs><linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4A62"/><stop offset="1" stop-color="#FF5A45"/></linearGradient><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#031273"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4A62"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#031273" text-anchor="start"><tspan x="60" dy="0.0">System architecture — AI Learning Assistant</tspan></text><text x="60" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5A6391" text-anchor="start"><tspan x="60" dy="0.0">How a question travels through FastAPI, LangChain, LangGraph and an optional LangSmith trace</tspan></text><rect x="60" y="128" width="1480" height="5" rx="2" fill="url(#coral)"/><rect x="60" y="190" width="300" height="200" rx="16" fill="#F2F4FF" stroke="#031273" stroke-width="2.2"/><text x="84" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#031273" text-anchor="start"><tspan x="84" dy="0.0">Client</tspan></text><text x="84" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="84" dy="0.0">Swagger UI at /docs</tspan></text><text x="84" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="84" dy="0.0">curl or Postman</tspan></text><text x="84" y="316.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="84" dy="0.0">examples/sample_requests.py</tspan></text><rect x="440" y="190" width="380" height="200" rx="16" fill="#031273"/><text x="464" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0.0">FastAPI</tspan></text><text x="796" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE1E6" text-anchor="end"><tspan x="796" dy="0.0">app/main.py</tspan></text><text x="464" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0.0">Pydantic validation (422)</tspan></text><text x="464" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0.0">Error handling (502 · 503)</tspan></text><text x="464" y="316.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0.0">Request logging, no secrets</tspan></text><text x="464" y="342.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0.0">/health · /ask · /workflow</tspan></text><rect x="920" y="170" width="600" height="150" rx="16" fill="url(#coral)"/><text x="944" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="944" dy="0.0">LangChain — /ask</tspan></text><text x="1496" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE1E6" text-anchor="end"><tspan x="1496" dy="0.0">app/chains.py</tspan></text><text x="944" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="944" dy="0.0">Prompt template → chat model → Pydantic output parser</tspan></text><text x="944" y="270.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="944" dy="0.0">One call, one structured answer</tspan></text><rect x="920" y="360" width="600" height="170" rx="16" fill="#031273"/><text x="944" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="944" dy="0.0">LangGraph — /workflow</tspan></text><text x="1496" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE1E6" text-anchor="end"><tspan x="1496" dy="0.0">app/graph.py</tspan></text><text x="944" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="944" dy="0.0">StateGraph: receive → classify → explain → add_example → validate</tspan><tspan x="944" dy="21.6">→ retry or fallback → finalize</tspan></text><rect x="920" y="580" width="600" height="150" rx="16" fill="#F2F4FF" stroke="#031273" stroke-width="2.2"/><text x="944" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#031273" text-anchor="start"><tspan x="944" dy="0.0">Chat model provider</tspan></text><text x="1496" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF4A62" text-anchor="end"><tspan x="1496" dy="0.0">app/llm.py</tspan></text><text x="944" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="944" dy="0.0">Mock (default, offline, labelled) · OpenAI · Ollama (local)</tspan></text><text x="944" y="680.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="944" dy="0.0">Chosen by LLM_PROVIDER</tspan></text><rect x="440" y="580" width="380" height="150" rx="16" fill="#FFFFFF" stroke="#FF4A62" stroke-width="2.2" stroke-dasharray="9 6"/><text x="464" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#031273" text-anchor="start"><tspan x="464" dy="0.0">LangSmith</tspan></text><text x="796" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF4A62" text-anchor="end"><tspan x="796" dy="0.0">app/observability.py</tspan></text><text x="464" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="464" dy="0.0">Optional: traces, latency, errors,</tspan></text><text x="464" y="680.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="464" dy="0.0">evaluations — only when enabled</tspan></text><rect x="60" y="580" width="300" height="150" rx="16" fill="#F2F4FF" stroke="#031273" stroke-width="2.2"/><text x="84" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#031273" text-anchor="start"><tspan x="84" dy="0.0">Configuration</tspan></text><text x="336" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF4A62" text-anchor="end"><tspan x="336" dy="0.0">app/config.py</tspan></text><text x="84" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1B2559" text-anchor="start"><tspan x="84" dy="0.0">.env → LLM_PROVIDER, keys,</tspan><tspan x="84" dy="21.6">retries, tracing</tspan></text><path d="M 360 270 L 436 270" fill="none" stroke="#031273" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="398" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A6391" text-anchor="middle"><tspan x="398" dy="0.0">HTTP</tspan></text><path d="M 820 230 L 916 230" fill="none" stroke="#031273" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="868" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#031273" text-anchor="middle"><tspan x="868" dy="0.0">/ask</tspan></text><path d="M 820 340 L 870 340 L 870 445 L 916 445" fill="none" stroke="#031273" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="868" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#031273" text-anchor="middle"><tspan x="868" dy="0.0">/workflow</tspan></text><path d="M 1490 360 L 1490 324" fill="none" stroke="#FF4A62" stroke-width="2.4" marker-end="url(#arrow-coral)"/><text x="1480" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF4A62" text-anchor="end"><tspan x="1480" dy="0.0">nodes call chains</tspan></text><path d="M 1520 245 L 1560 245 L 1560 655 L 1524 655" fill="none" stroke="#031273" stroke-width="2.4" marker-end="url(#arrow-blue)"/><path d="M 1220 530 L 1220 576" fill="none" stroke="#031273" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="1232" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A6391" text-anchor="start"><tspan x="1232" dy="0.0">model calls</tspan></text><path d="M 630 390 L 630 576" fill="none" stroke="#FF4A62" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrow-coral)"/><text x="642" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF4A62" text-anchor="start"><tspan x="642" dy="0.0">traces of /ask and</tspan></text><text x="642" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF4A62" text-anchor="start"><tspan x="642" dy="0.0">/workflow runs (optional)</tspan></text><path d="M 360 655 L 436 655" fill="none" stroke="#031273" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/><text x="398" y="643" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A6391" text-anchor="middle"><tspan x="398" dy="0.0">settings</tspan></text><rect x="60" y="780" width="1480" height="92" rx="16" fill="#031273"/><text x="96" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="96" dy="0.0">Python 3.10+</tspan></text><text x="96" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFB3BE" text-anchor="start"><tspan x="96" dy="0.0">runs every layer</tspan></text><text x="330" y="824" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="330" dy="0.0">Reusable modules in app/ · type hints and Pydantic models · logging with secret redaction · automated pytest tests</tspan></text><text x="60" y="930" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6391" text-anchor="start"><tspan x="60" dy="0.0">Coral = LangChain · Deep blue = LangGraph, FastAPI and plain Python · Dashed = optional</tspan></text><text x="1540" y="930" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF4A62" text-anchor="end"><tspan x="1540" dy="0.0">Shasu Vathanan - GEN AI - Product Manager · SHASUVATHANAN.COM</tspan></text></svg>
